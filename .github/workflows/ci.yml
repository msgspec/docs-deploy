name: Publisher checks

on:
  push:
    branches:
    - main
  pull_request:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Check out publisher code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'

    - name: Run routing, artifact, and workflow policy checks
      run: python -m unittest discover -s tests -v
